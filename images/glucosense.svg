<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <!-- Background -->
  <rect width="1200" height="675" fill="#f0f4f8"/>
  <!-- Sidebar -->
  <rect width="320" height="675" fill="#1a2b4a"/>
  <!-- Sidebar logo area -->
  <rect x="0" y="0" width="320" height="70" fill="#152238"/>
  <text x="30" y="44" font-family="Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#3498db">⬡ GlucoSense</text>
  <!-- Sidebar menu items -->
  <rect x="0" y="100" width="320" height="44" fill="#21395e"/>
  <text x="30" y="128" font-family="Segoe UI,sans-serif" font-size="15" fill="#fff">🏠  Dashboard</text>
  <text x="30" y="182" font-family="Segoe UI,sans-serif" font-size="15" fill="#8fa8c8">📋  New Prediction</text>
  <text x="30" y="226" font-family="Segoe UI,sans-serif" font-size="15" fill="#8fa8c8">📜  History</text>
  <text x="30" y="270" font-family="Segoe UI,sans-serif" font-size="15" fill="#8fa8c8">💡  Recommendations</text>
  <!-- Main content area -->
  <!-- Top bar -->
  <rect x="320" y="0" width="880" height="60" fill="#fff" rx="0"/>
  <text x="346" y="36" font-family="Segoe UI,sans-serif" font-size="18" font-weight="600" fill="#2c3e50">Diabetes Risk Prediction</text>
  <!-- Input form card -->
  <rect x="340" y="80" width="380" height="520" fill="#fff" rx="12" filter="url(#shadow)"/>
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.10)"/>
    </filter>
  </defs>
  <text x="360" y="114" font-family="Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#2c3e50">Health Parameters</text>
  <!-- Input fields -->
  <rect x="360" y="128" width="340" height="38" rx="6" fill="#f5f7fa" stroke="#e0e0e0" stroke-width="1"/>
  <text x="374" y="152" font-family="Segoe UI,sans-serif" font-size="13" fill="#7f8c8d">Glucose Level (mg/dL)</text>
  <text x="672" y="152" font-family="Segoe UI,sans-serif" font-size="13" fill="#2c3e50">148</text>
  <rect x="360" y="176" width="340" height="38" rx="6" fill="#f5f7fa" stroke="#e0e0e0" stroke-width="1"/>
  <text x="374" y="200" font-family="Segoe UI,sans-serif" font-size="13" fill="#7f8c8d">BMI</text>
  <text x="672" y="200" font-family="Segoe UI,sans-serif" font-size="13" fill="#2c3e50">33.6</text>
  <rect x="360" y="224" width="340" height="38" rx="6" fill="#f5f7fa" stroke="#e0e0e0" stroke-width="1"/>
  <text x="374" y="248" font-family="Segoe UI,sans-serif" font-size="13" fill="#7f8c8d">Blood Pressure (mmHg)</text>
  <text x="672" y="248" font-family="Segoe UI,sans-serif" font-size="13" fill="#2c3e50">72</text>
  <rect x="360" y="272" width="340" height="38" rx="6" fill="#f5f7fa" stroke="#e0e0e0" stroke-width="1"/>
  <text x="374" y="296" font-family="Segoe UI,sans-serif" font-size="13" fill="#7f8c8d">Age</text>
  <text x="672" y="296" font-family="Segoe UI,sans-serif" font-size="13" fill="#2c3e50">35</text>
  <rect x="360" y="320" width="340" height="38" rx="6" fill="#f5f7fa" stroke="#e0e0e0" stroke-width="1"/>
  <text x="374" y="344" font-family="Segoe UI,sans-serif" font-size="13" fill="#7f8c8d">Insulin (mu U/ml)</text>
  <text x="672" y="344" font-family="Segoe UI,sans-serif" font-size="13" fill="#2c3e50">0</text>
  <rect x="360" y="368" width="340" height="38" rx="6" fill="#f5f7fa" stroke="#e0e0e0" stroke-width="1"/>
  <text x="374" y="392" font-family="Segoe UI,sans-serif" font-size="13" fill="#7f8c8d">Skin Thickness (mm)</text>
  <text x="672" y="392" font-family="Segoe UI,sans-serif" font-size="13" fill="#2c3e50">35</text>
  <rect x="360" y="416" width="340" height="38" rx="6" fill="#f5f7fa" stroke="#e0e0e0" stroke-width="1"/>
  <text x="374" y="440" font-family="Segoe UI,sans-serif" font-size="13" fill="#7f8c8d">Diabetes Pedigree Function</text>
  <text x="672" y="440" font-family="Segoe UI,sans-serif" font-size="13" fill="#2c3e50">0.627</text>
  <rect x="360" y="464" width="340" height="38" rx="6" fill="#f5f7fa" stroke="#e0e0e0" stroke-width="1"/>
  <text x="374" y="488" font-family="Segoe UI,sans-serif" font-size="13" fill="#7f8c8d">Pregnancies</text>
  <text x="672" y="488" font-family="Segoe UI,sans-serif" font-size="13" fill="#2c3e50">6</text>
  <!-- Predict button -->
  <rect x="360" y="516" width="340" height="44" rx="22" fill="#3498db"/>
  <text x="530" y="544" font-family="Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">Predict Risk</text>
  <!-- Results card -->
  <rect x="740" y="80" width="430" height="520" fill="#fff" rx="12" filter="url(#shadow)"/>
  <text x="762" y="116" font-family="Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#2c3e50">Prediction Result</text>
  <!-- Gauge arc approximation -->
  <circle cx="955" cy="245" r="90" fill="none" stroke="#e8ecef" stroke-width="16"/>
  <circle cx="955" cy="245" r="90" fill="none" stroke="#3498db" stroke-width="16" stroke-dasharray="339" stroke-dashoffset="119" stroke-linecap="round" transform="rotate(-90 955 245)"/>
  <circle cx="955" cy="245" r="90" fill="none" stroke="#27ae60" stroke-width="0"/>
  <text x="955" y="238" font-family="Segoe UI,sans-serif" font-size="30" font-weight="700" fill="#2c3e50" text-anchor="middle">34%</text>
  <text x="955" y="262" font-family="Segoe UI,sans-serif" font-size="13" fill="#7f8c8d" text-anchor="middle">Risk Score</text>
  <!-- Risk badge -->
  <rect x="880" y="350" width="150" height="32" rx="16" fill="#d5f5e3"/>
  <text x="955" y="371" font-family="Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#27ae60" text-anchor="middle">✓ Low Risk</text>
  <!-- Recommendations -->
  <text x="762" y="414" font-family="Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#2c3e50">Lifestyle Recommendations</text>
  <rect x="762" y="424" width="388" height="1" fill="#f0f0f0"/>
  <text x="762" y="450" font-family="Segoe UI,sans-serif" font-size="12" fill="#27ae60">✓</text>
  <text x="778" y="450" font-family="Segoe UI,sans-serif" font-size="12" fill="#555">Maintain healthy BMI between 18.5–24.9</text>
  <text x="762" y="474" font-family="Segoe UI,sans-serif" font-size="12" fill="#27ae60">✓</text>
  <text x="778" y="474" font-family="Segoe UI,sans-serif" font-size="12" fill="#555">Exercise at least 30 mins/day</text>
  <text x="762" y="498" font-family="Segoe UI,sans-serif" font-size="12" fill="#27ae60">✓</text>
  <text x="778" y="498" font-family="Segoe UI,sans-serif" font-size="12" fill="#555">Limit sugar and refined carbohydrate intake</text>
  <text x="762" y="522" font-family="Segoe UI,sans-serif" font-size="12" fill="#e74c3c">✗</text>
  <text x="778" y="522" font-family="Segoe UI,sans-serif" font-size="12" fill="#555">Avoid sedentary lifestyle and smoking</text>
  <!-- Tech tags -->
  <rect x="762" y="548" width="62" height="22" rx="11" fill="#ebf5fb"/>
  <text x="793" y="563" font-family="Segoe UI,sans-serif" font-size="11" fill="#2980b9" text-anchor="middle">React</text>
  <rect x="832" y="548" width="62" height="22" rx="11" fill="#eafaf1"/>
  <text x="863" y="563" font-family="Segoe UI,sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">FastAPI</text>
  <rect x="902" y="548" width="70" height="22" rx="11" fill="#fef9e7"/>
  <text x="937" y="563" font-family="Segoe UI,sans-serif" font-size="11" fill="#f39c12" text-anchor="middle">XGBoost</text>
  <rect x="980" y="548" width="78" height="22" rx="11" fill="#f9ebea"/>
  <text x="1019" y="563" font-family="Segoe UI,sans-serif" font-size="11" fill="#e74c3c" text-anchor="middle">Scikit-learn</text>
</svg>
